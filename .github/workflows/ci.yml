name: CI
on:
  push:
    branches: [development]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --prefix frontend
      - run: npm test
      - run: npm run build
      - run: python -m pytest -q tests backend/tests
        env:
          PYTHONPATH: .:backend
          CIVITAS_DB_PATH: ${{ runner.temp }}/unicron-ci.sqlite3
          CIVITAS_MODEL_ROUTING_PERSISTENT: '0'
